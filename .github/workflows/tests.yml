name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 dropped: EOL since Oct 2025, and github-hosted ubuntu-latest (26.04)
        # no longer ships that interpreter.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Classifier self-test
        run: python skills/jev-command-classifier/scripts/classify_command.py --self-test

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Classifier self-test
        run: node skills/jev-command-classifier/scripts/classify_command.mjs --self-test
      - name: Unit tests
        run: node --test skills/jev-command-classifier/scripts/jev_classifier_js/test/*.test.mjs

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Unit tests
        working-directory: skills/jev-command-classifier/scripts/jev_classifier_js
        run: bun test
