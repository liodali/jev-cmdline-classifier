name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Classifier self-test
        run: python skills/jev-command-classifier/scripts/classify_command.py --self-test

  javascript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Classifier self-test
        run: node skills/jev-command-classifier/scripts/classify_command.mjs --self-test
      - name: Unit tests
        run: node --test skills/jev-command-classifier/scripts/jev_classifier_js/test/*.test.mjs

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Unit tests
        working-directory: skills/jev-command-classifier/scripts/jev_classifier_js
        run: bun test
